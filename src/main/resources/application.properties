spring.application.name=market_brief_api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/market_brief}
spring.datasource.username=${DB_USERNAME:market_brief}
spring.datasource.password=${DB_PASSWORD:market_brief}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
market-brief.write-api-key=${WRITE_API_KEY:}
market-brief.cors.allowed-origins=${WEB_ORIGINS:http://localhost:5173}
market-brief.market-data.finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
market-brief.market-data.finnhub.api-key=${FINNHUB_API_KEY:}
market-brief.market-data.twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
market-brief.market-data.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
market-brief.market-data.fmp.base-url=${FMP_BASE_URL:https://financialmodelingprep.com}
market-brief.market-data.fmp.api-key=${FMP_API_KEY:}
